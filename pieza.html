<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Selah · Pieza para compartir</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{--aq:#2cc5b6;--bk:#0a0d0f;--bk2:#12171a;--ln:#26302f;--tx:#eef6f5;--mu:#93a6a3}
*{box-sizing:border-box}body{margin:0;background:var(--bk);color:var(--tx);font-family:Montserrat,Arial,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media(max-width:820px){.w{grid-template-columns:1fr}}
canvas{width:100%;border-radius:16px;border:1px solid var(--ln);background:#111}
.p{background:var(--bk2);border:1px solid var(--ln);border-radius:16px;padding:16px;position:sticky;top:14px}
h1{font-size:18px;margin:0 0 4px}p{color:var(--mu);font-size:13px;line-height:1.5;margin:6px 0}
.b{display:block;width:100%;text-align:center;border:0;border-radius:12px;padding:13px;font:800 15px Montserrat,Arial;cursor:pointer;margin-top:10px;text-decoration:none}
.b1{background:var(--aq);color:#04110f}.b2{background:#25d366;color:#fff}.b3{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.m{margin-top:12px;font-weight:700;color:var(--aq);font-size:13.5px;min-height:20px}
.sz{display:flex;gap:8px;margin-top:8px}.sz button{flex:1;background:transparent;color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px;font:700 12.5px Montserrat;cursor:pointer}.sz button.on{border-color:var(--aq);color:var(--aq)}
</style>
</head>
<body>
<div class="w">
 <div><canvas id="cv"></canvas></div>
 <div class="p">
  <h1 id="ttl">Pieza para compartir</h1>
  <p>Comparte la imagen sola, sin texto, en WhatsApp, estados o redes.</p>
  <div class="sz"><button data-f="post" class="on">Post 4:5</button><button data-f="story">Estado / Historia 9:16</button></div>
  <button class="b b2" id="share">📲 Compartir por WhatsApp</button>
  <button class="b b1" id="copy">📋 Copiar imagen</button>
  <button class="b b3" id="dl">⬇ Descargar imagen</button>
  <a class="b b3" id="wa" target="_blank" rel="noopener" href="https://wa.me/">Abrir WhatsApp</a>
  <div class="m" id="m"></div>
  <p id="hint">En el celular, <b>Compartir</b> te deja elegir WhatsApp y el contacto, grupo o tu estado. En el computador, usa <b>Copiar imagen</b>, abre el chat y presiona <b>Ctrl+V</b>.</p>
 </div>
</div>
<script>
const $=s=>document.querySelector(s);
let J={};try{const h=decodeURIComponent(location.hash.replace(/^#j=/,''));J=JSON.parse(decodeURIComponent(escape(atob(h.replace(/-/g,'+').replace(/_/g,'/')))))}catch(e){}
const fmt=n=>'$'+Math.round(n).toLocaleString('es-CO');
const KICK={dia:['⚡ PROMO DEL DÍA · SOLO HOY','#ffc861','#1a1200'],sem:['🔥 CAMPAÑA DE LA SEMANA','#2cc5b6','#04110f'],of:['💥 OFERTAS SELAH','#ff4d4d','#ffffff']};
let FMT='post';
function img(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();if(/^https?:/.test(src)&&src.indexOf(location.origin)!==0)i.crossOrigin='anonymous';i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function rr(x,X,Y,W,H,R){x.beginPath();x.roundRect(X,Y,W,H,R)}
function fit(x,t,max,font,min){let s=font;x.font=`900 ${s}px Montserrat`;while(x.measureText(t).width>max&&s>min){s-=2;x.font=`900 ${s}px Montserrat`}return s}
function wrap(x,t,max){const w=String(t||'').split(/\s+/);const L=[];let l='';w.forEach(k=>{const z=l?l+' '+k:k;if(x.measureText(z).width>max&&l){L.push(l);l=k}else l=z});if(l)L.push(l);return L}
async function draw(){try{await document.fonts.load('900 italic 60px Montserrat');await document.fonts.load('700 30px Montserrat');await document.fonts.load('800 30px Montserrat')}catch(e){}
 const W=1080,H=FMT==='story'?1920:1350;const cv=$('#cv');cv.width=W;cv.height=H;const x=cv.getContext('2d');
 const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0f2b29');g.addColorStop(.55,'#0a0d0f');g.addColorStop(1,'#050708');x.fillStyle=g;x.fillRect(0,0,W,H);
 const r=x.createRadialGradient(W*.5,H*.45,10,W*.5,H*.45,W*.7);r.addColorStop(0,'rgba(44,197,182,.30)');r.addColorStop(1,'rgba(44,197,182,0)');x.fillStyle=r;x.fillRect(0,0,W,H);
 x.fillStyle='rgba(44,197,182,.10)';for(let k=0;k<4;k++){x.beginPath();x.moveTo(W-260+k*40,0);x.lineTo(W-230+k*40,0);x.lineTo(W-430+k*40,H);x.lineTo(W-460+k*40,H);x.fill()}
 const T=J.t||'dia',K=KICK[T]||KICK.dia,items=(J.items||[]).slice(0,4);const ST=FMT==='story';const top=ST?170:50;
 const logo=await img('img/b/logo-dark.png');const lh=ST?150:112;if(logo){x.drawImage(logo,W/2-lh*logo.width/logo.height/2,top,lh*logo.width/logo.height,lh)}
 let y=top+lh+30;
 x.font='800 30px Montserrat';const kw=x.measureText(K[0]).width+64;x.fillStyle=K[1];rr(x,W/2-kw/2,y,kw,62,31);x.fill();x.fillStyle=K[2];x.textAlign='center';x.textBaseline='middle';x.fillText(K[0],W/2,y+33);x.textBaseline='alphabetic';
 y+=62+30;
 const ti=String(J.title||'').trim();if(ti){x.fillStyle=T==='dia'?'#ffc861':'#ffffff';let fs=58;x.font=`italic 900 ${fs}px Montserrat`;let L=wrap(x,ti,W-120);while(L.length>2&&fs>38){fs-=4;x.font=`italic 900 ${fs}px Montserrat`;L=wrap(x,ti,W-120)}L=L.slice(0,2);L.forEach((l,i)=>x.fillText(l,W/2,y+fs+i*(fs+8)));y+=L.length*(fs+8)+fs*.35+20}
 // pie
 const dY=H-(ST?120:40);const bH=76,bY=dY-50-bH;let fTop=bY-24;let txL=[];if(J.tx){x.font='600 29px Montserrat';txL=wrap(x,J.tx,W-140).slice(0,2);fTop-=txL.length*38}
 x.textAlign='center';txL.forEach((l,i)=>{x.fillStyle='#d7e3e0';x.font='600 29px Montserrat';x.fillText(l,W/2,fTop+30+i*38)});
 x.fillStyle='#2cc5b6';rr(x,W/2-370,bY,740,bH,38);x.fill();x.fillStyle='#04110f';x.font='900 32px Montserrat';x.fillText('Pide por WhatsApp 321 649 5458',W/2,bY+50);
 x.fillStyle='#93a6a3';x.font='600 23px Montserrat';x.fillText('🛵 Domicilios área metropolitana · Envíos a todo el país · @suplementosselah',W/2,dY);
 const avail=fTop-20-y;const n=items.length;
 const price=(it,cx,py,big)=>{x.font=`900 ${big}px Montserrat`;const npT=fmt(it.np),npW=x.measureText(npT).width;const sm=Math.round(big*.46);x.font=`700 ${sm}px Montserrat`;const opT=it.pr>it.np?fmt(it.pr):'';const opW=opT?x.measureText(opT).width:0;const gap=opT?18:0;const sx=cx-(npW+opW+gap)/2;x.textAlign='left';
  if(opT){x.fillStyle='#93a6a3';x.fillText(opT,sx,py-big*.12);x.fillRect(sx,py-big*.12-sm*.35,opW,3)}x.fillStyle='#2cc5b6';x.font=`900 ${big}px Montserrat`;x.fillText(npT,sx+opW+gap,py);x.textAlign='center'};
 if(n===1){const it=items[0];const bw=Math.max(300,Math.min(ST?760:600,avail-200)),bx=W/2-bw/2,by=y;x.fillStyle='#fff';rr(x,bx,by,bw,bw,36);x.fill();const im=await img(it.img);if(im){const s=Math.min((bw-60)/im.width,(bw-60)/im.height);x.drawImage(im,W/2-im.width*s/2,by+bw/2-im.height*s/2,im.width*s,im.height*s)}
  if(it.d){x.save();x.translate(bx-20,by+24);x.rotate(-.1);x.fillStyle=T==='dia'?'#ffc861':'#ff4d4d';rr(x,0,0,190,88,22);x.fill();x.fillStyle=T==='dia'?'#1a1200':'#fff';x.font='900 56px Montserrat';x.textAlign='center';x.fillText('−'+it.d+'%',95,64);x.restore()}
  let yy=by+bw+56;x.textAlign='center';x.fillStyle='#fff';x.font='800 40px Montserrat';const NL=wrap(x,it.n,W-140).slice(0,2);NL.forEach((l,i)=>x.fillText(l,W/2,yy+i*46));yy+=(NL.length-1)*46+40;
  x.fillStyle='#93a6a3';x.font='600 26px Montserrat';x.fillText(it.b||'',W/2,yy);yy+=Math.max(76,(fTop-yy)*.55);price(it,W/2,Math.min(yy,fTop-14),80)}
 else if(n>1){const rows=Math.ceil(n/2),gap=30,cw=(W-120-gap)/2,ch=Math.min(cw+150,(avail-gap*(rows-1))/rows);const ih=ch-150;
  for(let i=0;i<n;i++){const it=items[i],cx=60+(i%2)*(cw+gap),cy=y+Math.floor(i/2)*(ch+gap);x.fillStyle='rgba(255,255,255,.07)';rr(x,cx,cy,cw,ch,28);x.fill();x.fillStyle='#fff';rr(x,cx+12,cy+12,cw-24,ih,22);x.fill();
   const im=await img(it.img);if(im){const s=Math.min((cw-56)/im.width,(ih-28)/im.height);x.drawImage(im,cx+cw/2-im.width*s/2,cy+12+ih/2-im.height*s/2,im.width*s,im.height*s)}
   if(it.d){x.fillStyle='#ff4d4d';rr(x,cx+22,cy+22,118,54,16);x.fill();x.fillStyle='#fff';x.font='900 33px Montserrat';x.textAlign='center';x.fillText('−'+it.d+'%',cx+81,cy+60)}
   x.textAlign='center';x.fillStyle='#fff';x.font='800 25px Montserrat';const L=wrap(x,it.n,cw-34).slice(0,2);L.forEach((l,k)=>x.fillText(l,cx+cw/2,cy+ih+50+k*30));
   price(it,cx+cw/2,cy+ch-22,42)}}
}
function blob(){return new Promise(r=>$('#cv').toBlob(r,'image/png'))}
const fname=()=>'selah_'+(J.t||'promo')+'_'+(FMT)+'.png';
const msg=t=>{$('#m').textContent=t};
$('#ttl').textContent={dia:'⚡ Promo del día',sem:'🔥 Campaña de la semana',of:'💥 Ofertas'}[J.t]||'Pieza para compartir';
if(J.cel)$('#wa').href='https://wa.me/57'+J.cel;
$('#share').onclick=async()=>{const b=await blob();const f=new File([b],fname(),{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});msg('✅ Listo')}catch(e){}}else{try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);msg('Imagen copiada. Se abre WhatsApp: elige el chat y presiona Ctrl+V.')}catch(e){dl(b);msg('Imagen descargada: adjúntala en WhatsApp con el clip 📎.')}window.open($('#wa').href,'_blank')}};
$('#copy').onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob()})]);msg('✅ Imagen copiada: pégala con Ctrl+V')}catch(e){msg('Tu navegador no deja copiar: usa Descargar.')}};
function dl(b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
$('#dl').onclick=async()=>{dl(await blob());msg('✅ Descargada en tu carpeta de Descargas')};
document.querySelectorAll('.sz button').forEach(b=>b.onclick=()=>{FMT=b.dataset.f;document.querySelectorAll('.sz button').forEach(z=>z.classList.toggle('on',z===b));draw()});
if(!(J.items||[]).length){msg('No llegó información de la promo. Ábrela desde el administrador.')}
draw();
</script>
</body>
</html>
